services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: local_disposable_test_only
      POSTGRES_DB: aquageo_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/integration/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./supabase/full_schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aquageo_test"]
      interval: 2s
      timeout: 2s
      retries: 30
